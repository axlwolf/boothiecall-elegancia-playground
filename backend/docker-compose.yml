version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: boothiecall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: boothiecall_dev
      POSTGRES_USER: boothiecall
      POSTGRES_PASSWORD: dev_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - boothiecall-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boothiecall -d boothiecall_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: boothiecall-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - boothiecall-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: boothiecall-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: boothiecall
      MINIO_ROOT_PASSWORD: dev_password_2024
      MINIO_DOMAIN: localhost
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - boothiecall-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Backend API (development)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: boothiecall-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://boothiecall:dev_password_2024@postgres:5432/boothiecall_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_key_2024_boothiecall
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_key_2024_boothiecall
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: boothiecall
      MINIO_SECRET_KEY: dev_password_2024
      MINIO_USE_SSL: false
      MINIO_BUCKET_NAME: boothiecall-assets
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - boothiecall-network
    command: npm run dev

  # Database Admin (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: boothiecall-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@boothiecall.net
      PGADMIN_DEFAULT_PASSWORD: dev_password_2024
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - boothiecall-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  boothiecall-network:
    driver: bridge
