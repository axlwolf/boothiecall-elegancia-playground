services:
  # PHP Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boothiecall-backend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Bind mount for development (hot reload)
      - .:/var/www/html
      # Named volumes for persistent data
      - uploads_data:/var/www/html/uploads
      - logs_data:/var/www/html/logs
      - cache_data:/var/www/html/cache
    environment:
      - APP_ENV=development
      - DB_HOST=mysql
      - DB_NAME=boothiecall
      - DB_USER=boothiecall
      - DB_PASS=boothiecall_password
      - CACHE_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - boothiecall-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: boothiecall-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: boothiecall
      MYSQL_USER: boothiecall
      MYSQL_PASSWORD: boothiecall_password
    volumes:
      # Persistent database storage
      - mysql_data:/var/lib/mysql
      # Initialization scripts
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    networks:
      - boothiecall-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "boothiecall",
          "-pboothiecall_password",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: boothiecall-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - boothiecall-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: boothiecall-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: boothiecall
      PMA_PASSWORD: boothiecall_password
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - boothiecall-network

# Named volumes for persistent data
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  cache_data:
    driver: local

# Network for service communication
networks:
  boothiecall-network:
    driver: bridge
    name: boothiecall-network
