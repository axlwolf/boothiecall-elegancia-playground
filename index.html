<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Self-hosted Fonts - Optimized for performance -->
    <link rel="preload" href="/fonts/cinzel-400.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/fonts/montserrat-400.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/fonts/montserrat-500.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="/fonts/fonts.css">
    
    <!-- Base href - set explicitly for both environments -->
    <script>
      // Detect environment and set appropriate base href
      const isVercel = window.location.hostname.includes('vercel.app');
      const basePath = isVercel ? '/' : '/playground/';
      
      // Always set base href explicitly
      const baseElement = document.createElement('base');
      baseElement.href = basePath;
      document.head.appendChild(baseElement);
      
      // Update font preload paths based on environment
      const fontLinks = document.querySelectorAll('link[href^="/fonts/"]');
      fontLinks.forEach(link => {
        if (link.href.startsWith('/fonts/')) {
          link.href = basePath + link.href.substring(1);
        }
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoothieCall Playground - Elegancia Nocturna</title>
    <meta name="description" content="A sophisticated web-based photobooth application featuring the elegant Elegancia Nocturna design system" />
    <meta name="author" content="BoothieCall" />

    <meta property="og:title" content="BoothieCall Playground - Elegancia Nocturna" />
    <meta property="og:description" content="Create stunning photo strips with luxury dark aesthetics and gold accents" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
